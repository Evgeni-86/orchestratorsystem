version: '3.8'

services:

  task-registry:
    build: task-registry
    environment:
      - HOST_NAME=postgres
      - RABBITMQ_HOST_NAME=rabbitmq
      - JAVA_TOOL_OPTIONS=-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9010 -Dcom.sun.management.jmxremote.rmi.port=9010 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=localhost -XX:StartFlightRecording=filename=/tmp/app.jfr,settings=profile
    ports:
      - "8080:8080"
      - "9010:9010"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  postgres:
    image: postgres:17
    restart: always
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=${POSTGRESDB_USR}
      - POSTGRES_PASSWORD=${POSTGRESDB_PWD}
      - POSTGRES_DB=orchestratorsystem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 2s
      retries: 60
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
      
  rabbitmq:
    image: rabbitmq:3.11.8-management
    restart: always
    container_name: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USR}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PWD}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 2s
      retries: 60

volumes:
  postgres_data: